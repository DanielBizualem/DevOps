name: DevOps_Pipeline
on: [push]
jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # This line below fixes the warning by setting the environment variable
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: echo "Automated testing completed successfully!"
  Deploy:
    needs: Build-and-Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Deploy
        run: echo "Deployed code to production server."
